[package]
name = "hope-app"
version = "0.1.0"
edition = "2024"

[dependencies]
core-domain = { path = "../crates/core-domain" }
export-engine = { path = "../crates/export-engine" }
project-store = { path = "../crates/project-store" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
storyboard-pipeline = { path = "../crates/storyboard-pipeline" }
tauri = { version = "2", features = [] }
validators = { path = "../crates/validators" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "hope-app"
path = "src/main.rs"
