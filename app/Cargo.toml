[package]
name = "hope-app"
version = "0.1.0"
edition = "2024"

[dependencies]
core-domain = { path = "../crates/core-domain" }
export-engine = { path = "../crates/export-engine" }
project-store = { path = "../crates/project-store" }
serde = { version = "1", features = ["derive"] }
storyboard-pipeline = { path = "../crates/storyboard-pipeline" }
tauri = { version = "2" }
validators = { path = "../crates/validators" }

[build-dependencies]
tauri-build = { version = "2" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "hope-app"
path = "src/main.rs"
